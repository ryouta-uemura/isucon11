# /etc/nginx/conf.d/ltsv.conf として配置する。
#
# ここには log_format だけを置く（log_format は http コンテキスト専用のため）。
# access_log の切り替えは server ブロック側で行う: tools/setup-nginx.sh を参照。
#
# なぜ conf.d に access_log を書かないか:
#   isucon11q の nginx.conf は http レベルで既に
#     access_log /var/log/nginx/access.log main;
#   を定義している。nginx は同一レベルの複数 access_log をすべて出力するため、
#   conf.d に access_log を足すと同じファイルへ main 形式と ltsv 形式が混ざって
#   二重書き込みされる。server レベルで定義すれば http レベルの指定は継承されず、
#   ltsv だけがきれいに残る。
#
# フィールドの意味:
#   time     : $msec = レスポンス完了時刻(epoch秒, ミリ秒精度)。
#              開始時刻は time - reqtime で復元する（analyze.py がそうしている）。
#   reqtime  : リクエスト受信から応答完了まで（クライアントから見た時間）
#   apptime  : upstream(Goアプリ)の応答時間。reqtime との差が待ち行列・転送時間。
#   reqid    : $request_id。X-Request-Id でアプリへ渡せば縦断トレースに使える(レイヤ3)。
#   uid      : セッション cookie。isucon11q の Go 実装のセッション名は "isucondition"。
#
# log_format の名前を ltsv ではなく ltsv_ts にしているのは、競技者側の nginx.conf が
# 既に `log_format ltsv` を定義している場合があるため。nginx は同名の log_format を
# 二重定義するとエラーになるので、計測用は衝突しない名前にしておく。
#
# escape=json はタブ・改行をエスケープするので LTSV が壊れない。
# 未設定の値は "-" ではなく空文字になる（analyze.py 側で吸収済み）。

log_format ltsv_ts escape=json 'time:$msec\t'
                            'method:$request_method\t'
                            'uri:$request_uri\t'
                            'status:$status\t'
                            'reqtime:$request_time\t'
                            'apptime:$upstream_response_time\t'
                            'reqid:$request_id\t'
                            'uid:$cookie_isucondition\t'
                            'size:$body_bytes_sent\t'
                            # nginx 自身の CPU の行き先を切り分けるための3つ:
                            #   ssl_reused : "r"=TLSセッション再利用 / "."=フルハンドシェイク(高コスト)
                            #   conn_reqs  : そのコネクションで何本目か。1 ばかりなら keepalive が効いていない
                            #   gzip       : 圧縮比。空なら非圧縮。圧縮が効いている範囲が分かる
                            'ssl_reused:$ssl_session_reused\t'
                            'conn:$connection\t'
                            'conn_reqs:$connection_requests\t'
                            'gzip:$gzip_ratio';
