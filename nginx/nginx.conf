user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;


events {
    # worker_connections  1024;
    worker_connections  4096;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

#    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" '
#                      '"$http_user_agent" "$http_x_forwarded_for"';
    log_format ltsv "time:$time_local\t"
                    "host:$remote_addr\t"
                    "forwardedfor:$http_x_forwarded_for\t"
                    "req:$request\t"
                    "status:$status\t"
                    "method:$request_method\t"
                    "uri:$request_uri\t"
                    "size:$body_bytes_sent\t"
                    "referer:$http_referer\t"
                    "ua:$http_user_agent\t"
                    "reqtime:$request_time\t"
                    "cache:$upstream_http_x_cache\t"
                    "runtime:$upstream_http_x_runtime\t"
                    "apptime:$upstream_response_time\t"
                    "vhost:$host";

    # access_log  /var/log/nginx/access.log  ltsv;
	access_log off;
    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # 切った方が圧倒的に速い。ベンチ同居で +66%、ベンチ別VMでも +82%。
    #
    #   同居 gzip on   7,535,851 / 7,230,056   nginx 1.05コア   転送 207MB
    #   同居 gzip off 12,447,621 /12,087,808   nginx 0.64コア   転送 1,445MB
    #   分離 gzip on   2,331,230 / 3,841,915   nginx 1.40〜1.60  転送  84〜121MB
    #   分離 gzip off  5,272,874 / 5,966,086   nginx 1.30〜1.32  転送 763〜830MB
    #
    # 圧縮率は約7:1 で、60秒で 1.4GB を圧縮していた計算になる。
    # comp_level 1 でも毎秒24MBの圧縮は nginx CPU の約4割を食う。
    # 別VM構成では転送量が7倍になるぶんパケット処理が増えるが、
    # それでも圧縮コストの方が大きく、nginx CPU はむしろ下がる。
    # 本番は実NICで TSO が効くぶん、切る不利はここよりさらに小さいはず。
    gzip  off;
    gzip_comp_level 1; # 圧縮率よりもCPU節約が優先
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript; # 画像は対象外とする, jpegなので圧縮が厳しそう
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
